name: Temporary Ver03 final validation

on:
  push:
    branches: ["ci-hardening-ver03-temp"]

jobs:
  validate-final-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode clean source package
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('working.zip').write_bytes(
              base64.b64decode(Path('temp/ver03-source.zip.b64').read_text())
          )
          PY
          rm -rf working
          mkdir working
          unzip -q working.zip -d working
      - name: Install pinned release dependencies
        working-directory: working
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,dev,quality]"
      - name: Ruff lint
        working-directory: working
        run: ruff check . | tee ../ruff-check.txt
      - name: Ruff format check
        working-directory: working
        run: ruff format --check . | tee ../ruff-format.txt
      - name: Mypy
        working-directory: working
        run: mypy solarhpo | tee ../mypy.txt
      - name: Tests and branch coverage
        working-directory: working
        run: python -m pytest --cov=solarhpo --cov-report=term-missing --cov-report=xml --cov-fail-under=85 | tee ../pytest-coverage.txt
      - name: Build source and wheel
        working-directory: working
        run: python -m build
      - name: Installed-wheel smoke outside checkout
        run: |
          python -m pip install --force-reinstall working/dist/*.whl
          mkdir -p /tmp/solarhpo-wheel-smoke
          cd /tmp/solarhpo-wheel-smoke
          solarhpo-run \
            --config "$GITHUB_WORKSPACE/working/configs/base.yaml" \
            --db /tmp/solarhpo-wheel-smoke/smoke.db \
            --set dataset.days=50 outer_folds=2 inner_folds=2 \
              final_holdout_hours=48 model=histgb optimizer=random max_evals=2 \
              probabilistic=false dataset.forecast_horizon_hours=1 \
              'dataset.target_lags=[1,2,24]' dataset.baseline_lag_hours=24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ver03-final-validation-reports
          path: |
            ruff-check.txt
            ruff-format.txt
            mypy.txt
            pytest-coverage.txt
            working/dist/
          retention-days: 1
