name: Temporary Ver03 tooling export

on:
  push:
    branches: ["ci-hardening-ver03-temp"]

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download pinned quality-tool wheels
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --dest wheelhouse \
            ruff==0.9.10 \
            mypy==1.13.0 \
            pandas-stubs \
            types-PyYAML \
            types-psutil \
            typing-extensions \
            mypy-extensions \
            pathspec
      - uses: actions/upload-artifact@v4
        with:
          name: ver03-quality-wheelhouse
          path: wheelhouse/
          retention-days: 1
