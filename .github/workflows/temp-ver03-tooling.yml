name: Temporary Ver03 tooling export

on:
  push:
    branches: ["ci-hardening-ver03-temp"]
  pull_request:
    branches: ["main"]

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download pinned build tools
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --dest wheelhouse \
            build==1.2.2.post1 \
            pyproject-hooks \
            packaging
      - uses: actions/upload-artifact@v4
        with:
          name: ver03-build-wheelhouse
          path: wheelhouse/
          retention-days: 1
