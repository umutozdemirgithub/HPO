name: Temporary Ver03 tooling export

on:
  push:
    branches: ["ci-hardening-ver03-temp"]
  pull_request:
    branches: ["main"]

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download pinned quality-tool wheels
        run: |
          python -m pip install --upgrade pip
          mkdir wheelhouse
          python -m pip download --dest wheelhouse \
            ruff==0.9.10 \
            pandas-stubs \
            types-PyYAML \
            types-psutil \
            typing-extensions \
            mypy-extensions \
            pathspec
          python -m pip download --dest wheelhouse --only-binary=:all: --no-deps \
            --python-version 313 --implementation cp --abi cp313 \
            --platform manylinux_2_17_x86_64 \
            mypy==1.13.0
      - uses: actions/upload-artifact@v4
        with:
          name: ver03-quality-wheelhouse-py313
          path: wheelhouse/
          retention-days: 1
